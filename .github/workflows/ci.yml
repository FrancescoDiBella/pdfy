name: PDF regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - name: Verify browser dependencies
        run: |
          # Hosted runners usually have the required libraries already.
          # Install OS packages only if Chromium cannot launch.
          node --input-type=module <<'NODE' || npx playwright install-deps chromium
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          await browser.close();
          NODE
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results-and-screenshots
          path: test-results/
          retention-days: 7
